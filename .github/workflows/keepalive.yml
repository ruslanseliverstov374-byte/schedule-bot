name: keepalive

# Не даёт бесплатному сервису Render засыпать: раз в 5 минут дёргает /health.
# Спящий сервис не может присылать напоминания, поэтому пинг важен.
#
# Настройка: после создания сервиса на Render укажите его адрес в переменной
# репозитория BOT_URL (Settings → Secrets and variables → Actions → Variables),
# либо просто поправьте DEFAULT_URL ниже.
#
# Важно: GitHub отключает расписание после 60 дней без активности в репозитории.
# Если это критично — продублируйте пинг с компьютера (install_ping.bat) или
# через cron-job.org.

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Проверяем, что бот отвечает
        run: |
          set -e
          URL="${{ vars.BOT_URL }}"
          if [ -z "$URL" ]; then
            URL="https://schedule-bot.onrender.com"
          fi
          echo "Пингую $URL/health"
          code=$(curl -s -o /dev/null -w "%{http_code}" -m 60 "$URL/health" || echo 000)
          echo "GET $URL/health -> $code"
          if [ "$code" != "200" ]; then
            echo "Сервис не ответил 200 — возможно, он просыпается. Повторяю через 20 секунд."
            sleep 20
            curl -s -o /dev/null -w "повтор: %{http_code}\n" -m 60 "$URL/health" || true
          fi
